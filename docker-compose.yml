services:
  # Database
  gymadmin-db:
    image: postgres:15-alpine
    container_name: gymadmin-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gymadmin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Backend API
  gymadmin-api:
    build:
      context: ./GymAdmin/src
      dockerfile: Dockerfile
    container_name: gymadmin-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=gymadmin-db;Database=gymadmin;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=GymAdmin
      - Jwt__Audience=GymAdmin
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - gymadmin-db
    ports:
      - "8080:8080"

  # Frontend
  gymadmin-web:
    build:
      context: ./gym-frontend
      dockerfile: Dockerfile
    container_name: gymadmin-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - gymadmin-api

volumes:
  postgres_data:
