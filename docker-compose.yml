services:
  # Database
  gymadmin-db:
    image: postgres:15-alpine
    container_name: gymadmin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gymadmin
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend API
  gymadmin-api:
    build:
      context: ./GymAdmin/src
      dockerfile: Dockerfile
    container_name: gymadmin-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=gymadmin-db;Database=gymadmin;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=GymAdmin
      - Jwt__Audience=GymAdmin
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - gymadmin-db
    ports:
      - "127.0.0.1:8080:8080" # Exposed locally for backend access if needed, or omit. Wait, it doesn't need to be exposed if the frontend proxy handles it! Let's just remove ports since nginx proxies it.

  # Frontend
  gymadmin-web:
    build:
      context: ./gym-frontend
      dockerfile: Dockerfile
    container_name: gymadmin-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      - gymadmin-api

volumes:
  postgres_data:
