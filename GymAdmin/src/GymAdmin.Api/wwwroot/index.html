  <body class="bg-dark-950 text-dark-100 font-sans antialiased">
    <div id="app">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #080808; font-family: 'Inter', sans-serif; position: fixed; inset: 0; z-index: 9999;">
        <div class="loading-spinner"></div>

          border-top-color: #FF6C13;
          animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;

        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
