server {
    listen 80;
    server_name localhost;

    # Bloquear acceso a archivos de configuración y control de versiones
    location ~* \.(env|git|htaccess|bak|sql|log|conf|ini)$ {
        return 404;
    }

    # Bloquear rutas de scanners específicos (WordPress, phpMyAdmin, instaladores)
    location ~* /(wp-admin|wp-content|wp-includes|wp-login|xmlrpc|phpmyadmin|pma|administrator|dbadmin|mysql|webdav|sqlite|cgi-bin|install\.php|setup\.php) {
        return 404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy para la API con Rate Limiting
    location /api {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://gymadmin-api:8080/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
